# Render deployment for Blue Pencil.
#
# One web service running the image in ./Dockerfile, which serves the API and
# the built browser app together on one origin. Postgres lives on Neon rather
# than on Render, because Render's own free database expires after 30 days and
# a portfolio link that dies after a month is worse than no link.
#
# Free instances have two constraints worth knowing rather than discovering:
# they sleep after 15 minutes of inactivity and take the better part of a
# minute to wake, and they have no shell. Migrations and seeding therefore run
# from a laptop against Neon, which is reachable from anywhere — see the
# Deploying section of the README.

services:
  - type: web
    name: blue-pencil
    runtime: docker
    plan: free
    # Closest to Neon's eu-central region; a round trip per query across the
    # Atlantic is very noticeable on the endpoints that make several.
    region: frankfurt
    dockerfilePath: ./Dockerfile

    # Render restarts the service if this stops answering. It touches nothing
    # but process uptime, so it stays cheap while the analysis endpoints work.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # The Neon connection string, including `?sslmode=require`. Not in this
      # file: it is committed, and this is a credential.
      - key: DATABASE_URL
        sync: false

      # Render generates a 256-bit value once and keeps it across deploys.
      # Regenerating it would sign every existing session cookie out.
      - key: SESSION_SECRET
        generateValue: true

      # The app and API share an origin, so CORS never actually applies — but
      # this is what the allowlist compares against if a second origin is ever
      # added. Set it to the real hostname Render assigns.
      - key: WEB_ORIGIN
        sync: false
